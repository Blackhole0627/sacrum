<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carrito — SACRUM</title>
<link rel="stylesheet" href="styles.css">
</head><body>

<header>
  <div class="topbar">
    <a href="index.html" style="display:flex;align-items:center;gap:10px"><img src="img/logo.png" alt="SACRUM"></a>
    <nav class="main"><a href="productos.html">Productos</a></nav>
    <div class="hd-right"><a class="cart-link" href="carrito.html">🛒 <span class="cart-count">0</span></a></div>
    <button class="hbtn" id="hbtn" aria-label="Menú">☰</button>
  </div>
</header>

<div class="cart-wrap">
  <h1>Tu carrito</h1>
  <div id="lines"></div>
  <div id="summaryBox"></div>
</div>

<footer>
  <div class="flogo">SACRUM</div>
  <p>Manos ecuatorianas, desde Ecuador para el mundo</p>
  <div class="fbottom">© 2026 Sacrum. Todos los derechos reservados.</div>
</footer>

<script src="store.js"></script>
<script>
  function render(){
    const lines = cartLines();
    const linesEl = document.getElementById('lines');
    const summaryEl = document.getElementById('summaryBox');
    if (!lines.length){
      linesEl.innerHTML = '<div class="empty-cart">Tu carrito está vacío.<br><br><a href="productos.html" style="color:var(--gold)">Ver catálogo</a></div>';
      summaryEl.innerHTML = ''; return;
    }
    linesEl.innerHTML = lines.map(l => `
      <div class="citem">
        <img src="${l.product.img}" alt="${l.product.name}">
        <div>
          <div class="name">${l.product.name}</div>
          <div style="font-size:11px;color:#999">${l.size} · ${l.finish}</div>
          <button class="rm" onclick="removeFromCart('${l.key}');render()">Quitar</button>
        </div>
        <div class="qtybox"><button onclick="setQty('${l.key}', ${l.qty - 1});render()">−</button><span>${l.qty}</span><button onclick="setQty('${l.key}', ${l.qty + 1});render()">+</button></div>
        <div class="price">${fmt(l.product.price * l.qty)}</div>
      </div>
    `).join('');
    const subtotal = cartTotal();
    summaryEl.innerHTML = `
      <div class="summary">
        <div class="row"><span>Subtotal</span><span>${fmt(subtotal)}</span></div>
        <div class="row"><span>Envío</span><span>Se calcula en el checkout</span></div>
        <div class="row total"><span>Total</span><span>${fmt(subtotal)}</span></div>
        <a href="checkout.html" style="display:block;text-align:center;background:var(--gold);color:#000;padding:15px;margin-top:18px;text-decoration:none;font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600">Ir a checkout</a>
      </div>`;
  }
  render();
</script>
<script>
  const hbtn = document.getElementById('hbtn');
  const mnav = document.querySelector('nav.main');
  if (hbtn && mnav) {
    let scrollLockY = 0;
    function setLock(on){
      if (on) {
        scrollLockY = window.scrollY;
        document.documentElement.style.overflow = 'hidden';
        document.body.style.position = 'fixed';
        document.body.style.top = (-scrollLockY) + 'px';
        document.body.style.width = '100%';
      } else {
        document.documentElement.style.overflow = '';
        document.body.style.position = '';
        document.body.style.top = '';
        document.body.style.width = '';
        window.scrollTo(0, scrollLockY);
      }
    }
    function closeMnav(){ mnav.classList.remove('open'); hbtn.classList.remove('open'); hbtn.textContent = '☰'; setLock(false); }
    hbtn.onclick = () => {
      const willOpen = !mnav.classList.contains('open');
      mnav.classList.toggle('open', willOpen);
      hbtn.classList.toggle('open', willOpen);
      hbtn.textContent = willOpen ? '✕' : '☰';
      setLock(willOpen);
    };
    mnav.querySelectorAll('a').forEach(a => a.addEventListener('click', closeMnav));
  }
</script>
</body></html>
